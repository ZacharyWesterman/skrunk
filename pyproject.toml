[tool.poetry]
name = "Skrunk Server"
version = "1.0.0"
description = ""
authors = ["Zachary Westerman <westerman.zachary@gmail.com>"]
license = "GPL 3"

[tool.poetry.dependencies]
ariadne = "0.15.1"
bcrypt = "3.2.2"
cachetools = "5.5.2"
cryptography = "50.0.0"
flask = "2.3.3"
imageio = { extras = ["ffmpeg"], version = "2.37.4" }
jsmin = "3.0.1"
lxml = "6.1.1"
markdown = "3.10.2"
networkx = "3.6"
pdf2image = "1.17.0"
pillow = "10.4.0"
psutil = "5.9.8"
PyJWT = "2.13.0"
pymongo = "4.17.0"
python = ">=3.11,<4.0"
python-ldap = { version = "3.4.7", optional = true }
pywebpush = "1.14.1"
pyzxing = "1.2.2"
qrcode = "7.4.2"
rcssmin = "1.2.2"
requests = "2.34.2"
tag-query = "1.2.0"
trimesh = "4.12.2"
waitress = "3.0.2"

[tool.poetry.group.dev.dependencies]
sphinx = "8.2.3"
sphinx-autodoc-typehints = "3.5.2"
pydata-sphinx-theme = "0.16.1"
sphinx-mdinclude = "0.6.2"

[tool.poetry.extras]
ldap = ["python-ldap"]

[build-system]
requires = ["poetry-core>=1.0.0"]
build-backend = "poetry.core.masonry.api"
