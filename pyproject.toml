[tool.poetry]
name = "Skrunk Server"
version = "1.0.0"
description = ""
authors = ["Zachary Westerman <westerman.zachary@gmail.com>"]
license = "GPL 3"

[tool.poetry.dependencies]
ariadne = "1.1.1"
bcrypt = "5.0.0"
cachetools = "7.2.6"
cryptography = "50.0.2"
flask = "3.1.3"
imageio = { extras = ["ffmpeg"], version = "2.37.4" }
jsmin = "3.0.1"
lxml = "6.1.3"
markdown = "3.11.2"
networkx = "3.7"
pdf2image = "1.17.0"
pillow = "13.0.0"
psutil = "7.2.2"
PyJWT = "2.15.0"
pymongo = "4.19.0"
python = ">=3.12,<4.0,!=3.14.1"
python-ldap = { version = "3.4.8", optional = true }
pywebpush = "2.5.0"
pyzxing = "1.2.2"
qrcode = "8.2.0"
rcssmin = "1.3.0"
requests = "2.34.2"
tag-query = "1.2.1"
trimesh = "5.2.0"
waitress = "3.0.2"
apscheduler = "3.11.3"
praw = "8.0.3"
urllib3 = "2.8.0"

[tool.poetry.group.dev.dependencies]
sphinx = "8.2.3"
sphinx-autodoc-typehints = "3.5.2"
pydata-sphinx-theme = "0.16.1"
sphinx-mdinclude = "0.6.2"

[tool.poetry.extras]
ldap = ["python-ldap"]

[build-system]
requires = ["poetry-core>=1.0.0"]
build-backend = "poetry.core.masonry.api"
