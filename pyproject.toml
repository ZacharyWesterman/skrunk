[tool.poetry]
name = "Skrunk Server"
version = "1.0.0"
description = ""
authors = ["Zachary Westerman <westerman.zachary@gmail.com>"]
license = "GPL 3"

[tool.poetry.dependencies]
ariadne = "^0.15.1"
bcrypt = "^3.2.2"
cachetools = "^5.3.1"
cryptography = ">=39.0.1"
flask = "^2.1.2"
imageio = { extras = ["ffmpeg"], version = "^2.36.0" }
jsmin = "^3.0.1"
Markdown = "^3.4.4"
networkx = "^3.4.2"
pdf2image = "^1.17.0"
Pillow = "^10.0.0"
psutil = "^5.9.6"
PyJWT = "^2.13.0"
pymongo = "^4.1.1"
python = ">=3.11,<4.0"
python-ldap = { version = "^3.4.5", optional = true }
pywebpush = "^1.14.0"
pyzxing = "^1.0.2"
qrcode = "^7.4.2"
rcssmin = "^1.2.2"
requests = "^2.28.2"
tag-query = "^1.0.1"
trimesh = "^4.4.7"
waitress = "^3.0.0"

[tool.poetry.group.dev.dependencies]
sphinx = "^8.2.3"
sphinx-autodoc-typehints = "^3.2.0"
pydata-sphinx-theme = "^0.16.1"
sphinx-mdinclude = "^0.6.2"

[tool.poetry.extras]
ldap = ["python-ldap"]

[build-system]
requires = ["poetry-core>=1.0.0"]
build-backend = "poetry.core.masonry.api"
