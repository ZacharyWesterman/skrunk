<div class="page">
	<h1>
		<i class="fa-solid fa-file-lines fa-xl"></i>
		Documents
	</h1>

	<div class="card alt">
		<div>
			<div class="clickable" *toggles="extra-search-fields">
				<h3>
					Filter documents by:
					<i class="right fa-solid fa-angles-down"></i>
				</h3>
			</div>

			<!-- Editor for tag query -->
			<code-input id="tag-query" class="monospace" style="width: calc(100% - 5rem);" syntax="tag-query"
				placeholder="Tag Query" *bind="navigate_to_page(0)"></code-input>
			<span class="right">
				<button class="reset clickable" *click="wipe_tag_editor">
					<i class="fa-solid fa-circle-xmark fa-xl"></i>
				</button>
				<span class="tooltip" *click="show_tags_how_to">
					<i class="fa-solid fa-circle-question fa-lg"></i>
					<span class="tooltiptext t-left">What is this?</span>
				</span>
			</span>
			<br>

			<!-- Input for document title -->
			<input id="filter-title" placeholder="Title" *bind="navigate_to_page(0)" />
			<span class="button clickable" *click="$.wipe('filter-title'); navigate_to_page(0)">
				<i class="fa-solid fa-circle-xmark fa-lg"></i>
			</span>
			<br>
			<div class="emphasis" id="tag-error"></div>

			<div class="expand-container" id="extra-search-fields">
				<div>
					<!-- Shared with me? -->
					<span>
						Shared with me?
						<input type="checkbox" id="filter-shared" *click="navigate_to_page(0)" ternary indeterminate />
					</span>
				</div>
			</div>

			<hr>

			<button class="alt icon tooltip" *click="download_all">
				<i class="fa-solid fa-file-arrow-down fa-xl"></i>
				<span class="tooltiptext t-float-right">Download selection</span>
			</button>

			<span class="tooltip right">
				<span class="tooltiptext t-float-left">Import documents</span>
				<button id="import-button" class="alt icon hidden" *click="import_documents()">
					<i class="fa-solid fa-file-import fa-xl"></i>
				</button>
			</span>

			<span class="tooltip right">
				<span class="tooltiptext t-float-left">Create new document</span>
				<button class="alt icon" *click="new_document()">
					<i class="fa-solid fa-square-plus fa-xl"></i>
				</button>
			</span>

			<div style="display: inline;" name="page-list"></div>

			<div id="delete-helper" class="expand-container clickable emphasis" *click="help_recover_docs">
				<div>
					<div>
						<br>
						<i class="fa-solid fa-circle-info"></i>
						<i>
							Accidentally deleted a document? <u>Click Here</u>.
						</i>
					</div>
				</div>
			</div>

		</div>
	</div>

	<div id="document-list"></div>

	<div class="card alt">
		<div class="card-inner">
			<div name="page-list"></div>
		</div>
	</div>
</div>

<script src="js/page/documents.js"></script>
