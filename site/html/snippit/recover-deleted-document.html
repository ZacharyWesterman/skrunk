You can re-download documents <u>up to 24 hours</u> after deletion, via the following:
<ol>
	<li>Open the <i class="fa-solid fa-hard-drive"></i><b>Files</b> page.</li>
	<li>
		Click the chevron <i class="fa-solid fa-angles-down"></i>
		to reveal extra search options.
	</li>
	<li>Click "Include Ephemeral Files".</li>
	<li>Put your document title in the "Title" search field.</li>
</ol>
